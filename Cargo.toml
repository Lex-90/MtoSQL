[package]
name = "m2sql"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "M Code to SQL CLI Translator"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
indexmap = "2"
regex = "1"
once_cell = "1"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1
